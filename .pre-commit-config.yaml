# Pre-commit configuration for security scanning
# Install with: pre-commit install
# Run manually with: pre-commit run --all-files

repos:
  # Gitleaks - secrets detection
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: gitleaks-secrets
        entry: gitleaks protect --staged --verbose
        language: system
        types: [file]
        stages: [commit, push]
        verbose: true

  # Semgrep - static analysis with custom rules
  - repo: local
    hooks:
      - id: semgrep-custom
        name: semgrep-custom-rules
        entry: semgrep scan --config=scanners/semgrep-rules/custom-security-rules.yaml --error --json
        language: system
        types: [python, javascript, typescript]
        stages: [commit]
        require_serial: true
        pass_filenames: true
        verbose: true

  # Bandit - Python security linter
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        name: bandit-python-security
        entry: bandit -r
        language: system
        types: [python]
        stages: [commit]
        args: ["-f", "txt", "-q"]
        verbose: true

  # ESLint - JavaScript/TypeScript security
  - repo: local
    hooks:
      - id: eslint-security
        name: eslint-security-plugin
        entry: npx eslint
        language: system
        types: [javascript, typescript]
        stages: [commit]
        require_serial: true
        pass_filenames: true
        args: ["--quiet", "--config", "vulnerable-samples/node-app/.eslintrc.json"]
        verbose: true

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ['--maxkb=1000']

# Configuration
default_stages: [commit]
fail_fast: true