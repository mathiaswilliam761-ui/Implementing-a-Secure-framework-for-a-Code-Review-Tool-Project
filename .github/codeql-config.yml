# CodeQL Configuration for Secure Code Review Framework
# This file configures CodeQL analysis for the project

name: "Secure Code Review CodeQL Config"

# Disable default queries and use only security-focused queries
disable-default-queries: true

# Use security-extended and security-and-quality query suites
queries:
  - uses: security-extended
  - uses: security-and-quality

# Paths to include in analysis
paths:
  - vulnerable-samples/python-app
  - vulnerable-samples/node-app

# Paths to exclude from analysis
paths-ignore:
  - .venv
  - node_modules
  - reports
  - deliverables
  - dashboards
  - scanners
  - scripts
  - infra
  - .git
  - "*.md"
  - "*.txt"
  - "*.json"
  - "*.yml"
  - "*.yaml"

# Python-specific configuration
language:
  python:
    # Use the standard Python query packs
    query-filters:
      - include:
          kind:
            - problem
            - alert
          severity:
            - error
            - warning

# JavaScript/TypeScript-specific configuration  
  javascript:
    # Include both JS and TS files
    query-filters:
      - include:
          kind:
            - problem
            - alert
          severity:
            - error
            - warning

# Custom query configuration for specific vulnerability types
# We want to focus on OWASP Top 10 related queries
query-suite-filters:
  - include:
      tags:
        - security
        - cwe
        - owasp

# Advanced configuration
# These settings help with performance and accuracy
extractor-options:
  python:
    # Use the default setup
    setup-command: ""
  javascript:
    # Include node_modules in extraction for better dependency analysis
    # but we'll exclude them in paths-ignore for performance
    extract-all-files: false

# Metrics and reporting
# Enable SARIF output for GitHub Security tab integration
sarif:
  category: "secure-code-review"
  include-query-help: true